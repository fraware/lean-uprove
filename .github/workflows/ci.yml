name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Set up Lean 4
      uses: leanprover/lean4@v4.12.0
      
    - name: Install dependencies
      run: |
        lake update
        lake build
        
    - name: Run tests
      run: |
        lake test
        lake exe test
        lake exe uprove-test-simple
        lake exe uprove-test-minimal-core
        lake exe uprove-test-production
        lake exe uprove-test-real
        
    - name: Run performance validation
      run: |
        lake exe uprove-performance-validation
        lake exe uprove-sla-validation
        
    - name: Run security scans
      run: |
        lake exe uprove-license-scan
        lake exe uprove-network-scan

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Set up Lean 4
      uses: leanprover/lean4@v4.12.0
      
    - name: Build
      run: |
        lake update
        lake build
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          build/
          lake-packages/
        retention-days: 30

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, build]
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}
          
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  validate-installation:
    name: Validate Installation
    runs-on: ubuntu-latest
    needs: [test, build]
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Set up Lean 4
      uses: leanprover/lean4@v4.12.0
      
    - name: Test installation script
      run: |
        chmod +x scripts/install.sh
        ./scripts/install.sh --help
        
    - name: Test Makefile
      run: |
        make help
        make build
        make test
        make clean