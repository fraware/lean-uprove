name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        lean_version: ["4.12.0", "4.11.0"]

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Lean ${{ matrix.lean_version }}
        uses: leanprover/lean-action@v1
        with:
          lean_version: ${{ matrix.lean_version }}

      - name: Cache Lake packages
        uses: actions/cache@v3
        with:
          path: .lake/packages
          key: ${{ runner.os }}-lake-${{ hashFiles('lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-

      - name: Lake Update
        run: lake update

      - name: Build Project
        run: lake build

      - name: Run Basic Tests
        run: lake exe test

      - name: Run Simple Test Suite
        run: lake exe uprove-test-simple

      - name: Run Production Test Suite
        run: lake exe uprove-test-production

      - name: Run Performance Validation
        run: lake exe uprove-performance-validation

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      
      - name: Run License Scan
        run: lake exe uprove-license-scan

      - name: Run Network Scan
        run: lake exe uprove-network-scan

  doc-generation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      
      - name: Generate Docs
        run: lake build docs

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan, doc-generation]
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      
      - name: Build Release Artifacts
        run: lake build release
        
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./build/release/*
            ./build/doc/*