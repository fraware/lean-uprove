name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean4@v4.31.0-rc1

      - name: Build and test
        run: |
          lake update
          lake build Uprove
          lake build UproveExamples
          lake test
          lake exe test
          lake exe uprove-test-simple
          lake exe uprove-test-real

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## lean-uprove ${{ github.ref_name }}

            **Docker:** `docker run --rm ghcr.io/${{ github.repository }}:${{ github.ref_name }} --help`

            **Docs:** [Quickstart](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/Quickstart.md) · [README](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md)

            **Lean usage:** `import UproveRegisterInit` and `import Uprove`.

            See generated release notes below for commits in this tag.
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            README.md
            LICENSE
            examples/
            docs/
            scripts/
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            README.md
            LICENSE
            examples/
            docs/
            scripts/
            Makefile
            Dockerfile
          retention-days: 90
